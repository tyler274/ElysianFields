name: Cross-Platform Qualification

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:17 UTC full cross-platform qualification run.
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - '.github/workflows/cross-platform.yml'
      - 'crates/ef-clinic-desktop/**'
      - 'crates/ef-mobile-desktop/**'
      - 'scripts/browser_e2e.py'
      - 'scripts/qa_multilingual_gui.py'
      - 'scripts/qa_ux_accessibility.py'
      - 'scripts/package_desktop.py'
      - 'scripts/run_desktop.sh'
      - 'scripts/verify_postgres_migrations.sh'
      - 'scripts/verify_pgwire_live.sh'
      - 'assets/desktop/**'
      - 'web/elysianfields/**'
      - 'extension/**'
      - 'deploy/**'
      - 'platform/**'

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELYMALLOC_REPO: https://github.com/tyler274/ElyMalloc.git
  ELYMALLOC_REV: cce11466569646e4e1f7afe9b44c6c80dd613b9f

jobs:
  desktop-macos:
    name: Desktop macOS ARM64 & ElyMalloc probe
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache macOS Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-macos-arm64-v2
          shared-key: cross-macos-arm64-v2
          cache-on-failure: true

      - name: Run full workspace tests on macOS ARM64
        run: |
          mkdir -p cross-platform-evidence
          HEADLESS_EXCLUDES="$(python3 scripts/ci_scope.py headless-workspace-excludes)"
          DESKTOP_CRATES="$(python3 scripts/ci_scope.py desktop-crates)"
          start_ts=$(python3 -c 'import time; print(time.time())')
          # shellcheck disable=SC2086
          cargo test --locked --workspace ${HEADLESS_EXCLUDES}
          if [ -n "${DESKTOP_CRATES}" ]; then
            # shellcheck disable=SC2086
            cargo test --locked ${DESKTOP_CRATES}
          fi
          end_ts=$(python3 -c 'import time; print(time.time())')
          python3 - "$start_ts" "$end_ts" <<'PY'
          import json, sys
          from pathlib import Path
          elapsed = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          Path("cross-platform-evidence/macos-workspace-tests.json").write_text(
              json.dumps({"status": "passed", "duration_secs": elapsed}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build native release binaries on macOS ARM64
        run: |
          native_bins="$(python3 scripts/ci_scope.py native-release-crates)"
          echo "Selected native release crates: ${native_bins}"
          start_ts=$(python3 -c 'import time; print(time.time())')
          # shellcheck disable=SC2086
          cargo build --locked --release ${native_bins}
          end_ts=$(python3 -c 'import time; print(time.time())')
          python3 - "$start_ts" "$end_ts" "$native_bins" <<'PY'
          import json, os, sys
          from pathlib import Path
          elapsed = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          release_dir = Path("target/release")
          binaries = sorted(
              (
                  {"name": p.name, "bytes": p.stat().st_size}
                  for p in release_dir.iterdir()
                  if p.is_file() and os.access(p, os.X_OK) and not p.name.endswith(".d")
              ),
              key=lambda item: item["name"],
          )
          Path("cross-platform-evidence/macos-native-release.json").write_text(
              json.dumps(
                  {
                      "status": "passed",
                      "crates_args": sys.argv[3],
                      "duration_secs": elapsed,
                      "binaries": binaries,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build & headless-smoke native Bevy desktop release apps (macOS ARM64)
        run: |
          mkdir -p cross-platform-evidence
          crates=()
          [ -d crates/ef-clinic-desktop ] && crates+=(ef-clinic-desktop)
          [ -d crates/ef-mobile-desktop ] && crates+=(ef-mobile-desktop)

          if [ "${#crates[@]}" -eq 0 ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          Path("cross-platform-evidence/macos-desktop-apps.json").write_text(
              json.dumps({"status": "not-present", "apps": {}}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            exit 0
          fi

          pkg_flags=()
          for c in "${crates[@]}"; do pkg_flags+=(-p "$c"); done
          start_ts=$(python3 -c 'import time; print(time.time())')
          cargo build --locked --release "${pkg_flags[@]}"
          end_ts=$(python3 -c 'import time; print(time.time())')

          python3 - "$start_ts" "$end_ts" "${crates[@]}" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          build_secs = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          apps = {}
          for crate in sys.argv[3:]:
              bin_path = Path("target/release") / crate
              assert bin_path.is_file(), f"missing release binary {bin_path}"
              proc = subprocess.run([str(bin_path), "--headless-smoke"], capture_output=True, text=True, check=True)
              out_text = proc.stdout.strip()
              try:
                  smoke = json.loads(out_text)
              except json.JSONDecodeError:
                  smoke = {"raw_stdout": out_text}
              apps[crate] = {
                  "binary": bin_path.name,
                  "bytes": bin_path.stat().st_size,
                  "headless_smoke": smoke,
                  "status": "passed",
              }
          Path("cross-platform-evidence/macos-desktop-apps.json").write_text(
              json.dumps({"status": "passed", "build_duration_secs": build_secs, "apps": apps}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          if [ -x target/release/ef-clinic-desktop ] && [ -x target/release/ef-mobile-desktop ]; then
            ver="0.1.0-${GITHUB_SHA:0:7}"
            python3 scripts/package_desktop.py \
              --platform macos-arm64 \
              --version "${ver}" \
              --clinic-bin target/release/ef-clinic-desktop \
              --mobile-bin target/release/ef-mobile-desktop \
              --out-dir dist/desktop-macos-arm64
            python3 scripts/package_desktop.py --verify --out-dir dist/desktop-macos-arm64
          fi

      - name: Upload macOS packaged desktop bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/desktop-macos-arm64/*.tar.gz
            dist/desktop-macos-arm64/SHA256SUMS.txt
            dist/desktop-macos-arm64/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cross-check iOS Simulator target (aarch64-apple-ios-sim) & Swift shims
        run: |
          mkdir -p cross-platform-evidence
          rustup target add aarch64-apple-ios-sim
          start_ts=$(python3 -c 'import time; print(time.time())')
          cargo check --locked --target aarch64-apple-ios-sim \
            -p ef-core \
            -p ef-connected-care \
            -p ef-mobile-domain \
            -p m1-mobile-lifecycle \
            -p ef-mobile-client
          end_ts=$(python3 -c 'import time; print(time.time())')

          swift_status="not-present"
          swift_files=()
          shopt -s nullglob
          swift_files=(platform/ios/Sources/ElysianMobileShim/*.swift)
          if [ "${#swift_files[@]}" -gt 0 ]; then
            ios_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
            swiftc -typecheck \
              -sdk "$ios_sdk" \
              -target arm64-apple-ios17.0-simulator \
              "${swift_files[@]}"
            swift_status="passed"
          fi

          swift_test_status="not-present"
          swift_test_secs="0"
          swift_test_files=(platform/ios/Tests/*/*.swift platform/ios/Tests/*.swift)
          if [ -d platform/ios/Tests ] && [ "${#swift_test_files[@]}" -gt 0 ]; then
            st_start=$(python3 -c 'import time; print(time.time())')
            swift test --package-path platform/ios
            st_end=$(python3 -c 'import time; print(time.time())')
            swift_test_secs=$(python3 -c "print(round(float('$st_end') - float('$st_start'), 2))")
            swift_test_status="passed"
          fi

          python3 - "$start_ts" "$end_ts" "$swift_status" "${swift_files[*]}" "$swift_test_status" "$swift_test_secs" "${swift_test_files[*]}" <<'PY'
          import json, sys
          from pathlib import Path
          elapsed = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          swift_list = sys.argv[4].split() if sys.argv[4].strip() else []
          test_list = sys.argv[7].split() if sys.argv[7].strip() else []
          Path("cross-platform-evidence/macos-ios-sim.json").write_text(
              json.dumps(
                  {
                      "status": "passed",
                      "target": "aarch64-apple-ios-sim",
                      "crates": [
                          "ef-core",
                          "ef-connected-care",
                          "ef-mobile-domain",
                          "m1-mobile-lifecycle",
                          "ef-mobile-client",
                      ],
                      "duration_secs": elapsed,
                      "swift_typecheck": {
                          "status": sys.argv[3],
                          "files": swift_list,
                      },
                      "swift_test": {
                          "status": sys.argv[5],
                          "duration_secs": float(sys.argv[6]),
                          "package_path": "platform/ios",
                          "files": test_list,
                      },
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Probe pinned ElyMalloc (cce11466) on macOS ARM64
        continue-on-error: true
        run: |
          set +e
          mkdir -p cross-platform-evidence
          probe_dir="${RUNNER_TEMP}/elymalloc-macos"
          rm -rf "$probe_dir"
          log_file="cross-platform-evidence/elymalloc-macos.log"
          start_ts=$(python3 -c 'import time; print(time.time())')

          {
            git init -q "$probe_dir" &&
            git -C "$probe_dir" fetch --depth 1 "$ELYMALLOC_REPO" "$ELYMALLOC_REV" &&
            git -C "$probe_dir" checkout -q FETCH_HEAD &&
            (
              cd "$probe_dir/rust" &&
              RUSTUP_TOOLCHAIN=1.99.1 cargo build --release &&
              RUSTUP_TOOLCHAIN=1.99.1 cargo test -p elymalloc-core
            )
          } >"$log_file" 2>&1
          probe_rc=$?
          end_ts=$(python3 -c 'import time; print(time.time())')

          tail -n 60 "$log_file" || true
          python3 - "$probe_rc" "$start_ts" "$end_ts" "$log_file" <<'PY'
          import json, os, sys
          from pathlib import Path
          rc = int(sys.argv[1])
          elapsed = round(float(sys.argv[3]) - float(sys.argv[2]), 2)
          log_lines = Path(sys.argv[4]).read_text(encoding="utf-8", errors="replace").splitlines()
          Path("cross-platform-evidence/macos-elymalloc-probe.json").write_text(
              json.dumps(
                  {
                      "repo": os.environ["ELYMALLOC_REPO"],
                      "rev": os.environ["ELYMALLOC_REV"],
                      "status": "passed" if rc == 0 else "failed",
                      "exit_code": rc,
                      "duration_secs": elapsed,
                      "log_tail": log_lines[-30:],
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          exit "$probe_rc"

      - name: Assemble macOS qualification JSON report
        if: always()
        run: |
          mkdir -p cross-platform-evidence
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          def load_opt(path: str) -> dict:
              p = Path(path)
              return json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {"status": "not-run"}

          rustc_ver = subprocess.check_output(["rustc", "--version"], text=True).strip()
          report = {
              "job": "desktop-macos",
              "runner_os": os.environ.get("RUNNER_OS", platform.system()),
              "runner_arch": os.environ.get("RUNNER_ARCH", platform.machine()),
              "platform": platform.platform(),
              "revision": os.environ.get("GITHUB_SHA", ""),
              "rustc": rustc_ver,
              "workspace_tests": load_opt("cross-platform-evidence/macos-workspace-tests.json"),
              "native_release": load_opt("cross-platform-evidence/macos-native-release.json"),
              "desktop_apps": load_opt("cross-platform-evidence/macos-desktop-apps.json"),
              "ios_sim_check": load_opt("cross-platform-evidence/macos-ios-sim.json"),
              "elymalloc_probe": load_opt("cross-platform-evidence/macos-elymalloc-probe.json"),
          }
          out = Path("cross-platform-evidence/desktop-macos.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload macOS qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-desktop-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-evidence/desktop-macos.json
          if-no-files-found: warn
          retention-days: 30

  desktop-windows:
    name: Desktop Windows MSVC & ElyMalloc probe
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Windows Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-windows-msvc-v2
          shared-key: cross-windows-msvc-v2
          cache-on-failure: true

      - name: Run full workspace tests on Windows x86_64 MSVC
        run: |
          mkdir -p cross-platform-evidence
          PY=$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          HEADLESS_EXCLUDES="$($PY scripts/ci_scope.py headless-workspace-excludes)"
          DESKTOP_CRATES="$($PY scripts/ci_scope.py desktop-crates)"
          start_ts=$($PY -c 'import time; print(time.time())')
          # shellcheck disable=SC2086
          cargo test --locked --workspace ${HEADLESS_EXCLUDES}
          if [ -n "${DESKTOP_CRATES}" ]; then
            # shellcheck disable=SC2086
            cargo test --locked ${DESKTOP_CRATES}
          fi
          end_ts=$($PY -c 'import time; print(time.time())')
          $PY - "$start_ts" "$end_ts" <<'PY'
          import json, sys
          from pathlib import Path
          elapsed = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          Path("cross-platform-evidence/windows-workspace-tests.json").write_text(
              json.dumps({"status": "passed", "duration_secs": elapsed}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build native release binaries on Windows x86_64 MSVC
        run: |
          PY=$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          native_bins="$($PY scripts/ci_scope.py native-release-crates)"
          echo "Selected native release crates: ${native_bins}"
          start_ts=$($PY -c 'import time; print(time.time())')
          # shellcheck disable=SC2086
          cargo build --locked --release ${native_bins}
          end_ts=$($PY -c 'import time; print(time.time())')
          $PY - "$start_ts" "$end_ts" "$native_bins" <<'PY'
          import json, sys
          from pathlib import Path
          elapsed = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          release_dir = Path("target/release")
          binaries = sorted(
              (
                  {"name": p.name, "bytes": p.stat().st_size}
                  for p in release_dir.iterdir()
                  if p.is_file() and p.suffix.lower() == ".exe"
              ),
              key=lambda item: item["name"],
          )
          Path("cross-platform-evidence/windows-native-release.json").write_text(
              json.dumps(
                  {
                      "status": "passed",
                      "crates_args": sys.argv[3],
                      "duration_secs": elapsed,
                      "binaries": binaries,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build & headless-smoke native Bevy desktop release apps (Windows MSVC)
        run: |
          mkdir -p cross-platform-evidence
          PY=$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          crates=()
          [ -d crates/ef-clinic-desktop ] && crates+=(ef-clinic-desktop)
          [ -d crates/ef-mobile-desktop ] && crates+=(ef-mobile-desktop)

          if [ "${#crates[@]}" -eq 0 ]; then
            $PY - <<'PY'
          import json
          from pathlib import Path
          Path("cross-platform-evidence/windows-desktop-apps.json").write_text(
              json.dumps({"status": "not-present", "apps": {}}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            exit 0
          fi

          pkg_flags=()
          for c in "${crates[@]}"; do pkg_flags+=(-p "$c"); done
          start_ts=$($PY -c 'import time; print(time.time())')
          cargo build --locked --release "${pkg_flags[@]}"
          end_ts=$($PY -c 'import time; print(time.time())')

          $PY - "$start_ts" "$end_ts" "${crates[@]}" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          build_secs = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          apps = {}
          for crate in sys.argv[3:]:
              bin_path = Path("target/release") / f"{crate}.exe"
              assert bin_path.is_file(), f"missing release binary {bin_path}"
              proc = subprocess.run([str(bin_path), "--headless-smoke"], capture_output=True, text=True, check=True)
              out_text = proc.stdout.strip()
              try:
                  smoke = json.loads(out_text)
              except json.JSONDecodeError:
                  smoke = {"raw_stdout": out_text}
              apps[crate] = {
                  "binary": bin_path.name,
                  "bytes": bin_path.stat().st_size,
                  "headless_smoke": smoke,
                  "status": "passed",
              }
          Path("cross-platform-evidence/windows-desktop-apps.json").write_text(
              json.dumps({"status": "passed", "build_duration_secs": build_secs, "apps": apps}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          if [ -f target/release/ef-clinic-desktop.exe ] && [ -f target/release/ef-mobile-desktop.exe ]; then
            ver="0.1.0-${GITHUB_SHA:0:7}"
            $PY scripts/package_desktop.py \
              --platform windows-x86_64 \
              --version "${ver}" \
              --clinic-bin target/release/ef-clinic-desktop.exe \
              --mobile-bin target/release/ef-mobile-desktop.exe \
              --out-dir dist/desktop-windows-x86_64
            $PY scripts/package_desktop.py --verify --out-dir dist/desktop-windows-x86_64
          fi

      - name: Upload Windows packaged desktop bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/desktop-windows-x86_64/*.zip
            dist/desktop-windows-x86_64/SHA256SUMS.txt
            dist/desktop-windows-x86_64/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Probe pinned ElyMalloc (cce11466) on Windows x86_64 MSVC
        continue-on-error: true
        run: |
          set +e
          mkdir -p cross-platform-evidence
          PY=$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          probe_dir="${RUNNER_TEMP}/elymalloc-windows"
          rm -rf "$probe_dir"
          log_file="cross-platform-evidence/elymalloc-windows.log"
          start_ts=$($PY -c 'import time; print(time.time())')

          {
            git init -q "$probe_dir" &&
            git -C "$probe_dir" fetch --depth 1 "$ELYMALLOC_REPO" "$ELYMALLOC_REV" &&
            git -C "$probe_dir" checkout -q FETCH_HEAD &&
            (
              cd "$probe_dir/rust" &&
              RUSTUP_TOOLCHAIN=1.99.1 cargo build --release &&
              RUSTUP_TOOLCHAIN=1.99.1 cargo test -p elymalloc-core
            )
          } >"$log_file" 2>&1
          probe_rc=$?
          end_ts=$($PY -c 'import time; print(time.time())')

          tail -n 60 "$log_file" || true
          $PY - "$probe_rc" "$start_ts" "$end_ts" "$log_file" <<'PY'
          import json, os, sys
          from pathlib import Path
          rc = int(sys.argv[1])
          elapsed = round(float(sys.argv[3]) - float(sys.argv[2]), 2)
          log_lines = Path(sys.argv[4]).read_text(encoding="utf-8", errors="replace").splitlines()
          Path("cross-platform-evidence/windows-elymalloc-probe.json").write_text(
              json.dumps(
                  {
                      "repo": os.environ["ELYMALLOC_REPO"],
                      "rev": os.environ["ELYMALLOC_REV"],
                      "status": "passed" if rc == 0 else "failed",
                      "exit_code": rc,
                      "duration_secs": elapsed,
                      "log_tail": log_lines[-30:],
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          exit "$probe_rc"

      - name: Assemble Windows qualification JSON report
        if: always()
        run: |
          mkdir -p cross-platform-evidence
          PY=$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          $PY - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          def load_opt(path: str) -> dict:
              p = Path(path)
              return json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {"status": "not-run"}

          rustc_ver = subprocess.check_output(["rustc", "--version"], text=True).strip()
          report = {
              "job": "desktop-windows",
              "runner_os": os.environ.get("RUNNER_OS", platform.system()),
              "runner_arch": os.environ.get("RUNNER_ARCH", platform.machine()),
              "platform": platform.platform(),
              "revision": os.environ.get("GITHUB_SHA", ""),
              "rustc": rustc_ver,
              "workspace_tests": load_opt("cross-platform-evidence/windows-workspace-tests.json"),
              "native_release": load_opt("cross-platform-evidence/windows-native-release.json"),
              "desktop_apps": load_opt("cross-platform-evidence/windows-desktop-apps.json"),
              "elymalloc_probe": load_opt("cross-platform-evidence/windows-elymalloc-probe.json"),
          }
          out = Path("cross-platform-evidence/desktop-windows.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-desktop-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-evidence/desktop-windows.json
          if-no-files-found: warn
          retention-days: 30

  desktop-linux-native:
    name: Desktop Linux x86_64 Native Bevy Apps
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install fast Linux linker and Bevy desktop GUI libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            lld \
            clang \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libvulkan-dev \
            libudev-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Linux desktop Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-desktop-linux-v2
          shared-key: cross-desktop-linux-v2
          cache-on-failure: true

      - name: Build & headless-smoke native Bevy desktop release apps (Linux x86_64)
        run: |
          mkdir -p cross-platform-evidence
          crates=()
          [ -d crates/ef-clinic-desktop ] && crates+=(ef-clinic-desktop)
          [ -d crates/ef-mobile-desktop ] && crates+=(ef-mobile-desktop)

          if [ "${#crates[@]}" -eq 0 ]; then
            python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          report = {
              "job": "desktop-linux-native",
              "runner_os": os.environ.get("RUNNER_OS", platform.system()),
              "runner_arch": os.environ.get("RUNNER_ARCH", platform.machine()),
              "platform": platform.platform(),
              "revision": os.environ.get("GITHUB_SHA", ""),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "status": "not-present",
              "apps": {},
          }
          out = Path("cross-platform-evidence/desktop-linux-native.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
            exit 0
          fi

          pkg_flags=()
          for c in "${crates[@]}"; do pkg_flags+=(-p "$c"); done
          start_ts=$(python3 -c 'import time; print(time.time())')
          cargo build --locked --release "${pkg_flags[@]}"
          end_ts=$(python3 -c 'import time; print(time.time())')

          python3 - "$start_ts" "$end_ts" "${crates[@]}" <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          build_secs = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          apps = {}
          for crate in sys.argv[3:]:
              bin_path = Path("target/release") / crate
              assert bin_path.is_file(), f"missing release binary {bin_path}"
              proc = subprocess.run([str(bin_path), "--headless-smoke"], capture_output=True, text=True, check=True)
              out_text = proc.stdout.strip()
              try:
                  smoke = json.loads(out_text)
              except json.JSONDecodeError:
                  smoke = {"raw_stdout": out_text}
              apps[crate] = {
                  "binary": bin_path.name,
                  "bytes": bin_path.stat().st_size,
                  "headless_smoke": smoke,
                  "status": "passed",
              }
          report = {
              "job": "desktop-linux-native",
              "runner_os": os.environ.get("RUNNER_OS", platform.system()),
              "runner_arch": os.environ.get("RUNNER_ARCH", platform.machine()),
              "platform": platform.platform(),
              "revision": os.environ.get("GITHUB_SHA", ""),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "build_duration_secs": build_secs,
              "apps": apps,
              "status": "passed",
          }
          out = Path("cross-platform-evidence/desktop-linux-native.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

          if [ -x target/release/ef-clinic-desktop ] && [ -x target/release/ef-mobile-desktop ]; then
            ver="0.1.0-${GITHUB_SHA:0:7}"
            python3 scripts/package_desktop.py \
              --platform linux-x86_64 \
              --version "${ver}" \
              --clinic-bin target/release/ef-clinic-desktop \
              --mobile-bin target/release/ef-mobile-desktop \
              --out-dir dist/desktop-linux-x86_64
            python3 scripts/package_desktop.py --verify --out-dir dist/desktop-linux-x86_64
          fi

      - name: Upload Linux packaged desktop bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/desktop-linux-x86_64/*.tar.gz
            dist/desktop-linux-x86_64/SHA256SUMS.txt
            dist/desktop-linux-x86_64/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux desktop qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-desktop-linux-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-evidence/desktop-linux-native.json
          if-no-files-found: warn
          retention-days: 30

  postgres-18:
    name: PostgreSQL 18 migrations & constraints
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elysian
          POSTGRES_PASSWORD: elysian_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U elysian -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: elysian
      PGPASSWORD: elysian_ci_password
      DATABASE_URL: postgresql://elysian:elysian_ci_password@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Cache Linux Rust build artifacts (when live pgwire verifier is present)
        if: hashFiles('scripts/verify_pgwire_live.sh') != ''
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-pg18-linux-v2
          shared-key: cross-pg18-linux-v2
          cache-on-failure: true

      - name: Verify PostgreSQL 18 migrations and constraints
        run: |
          mkdir -p cross-platform-evidence
          pg_version=$(psql -d postgres -tAc 'SELECT version();')
          echo "Connected to: ${pg_version}"
          echo "$pg_version" | grep -q 'PostgreSQL 18\.'

          if [ -f scripts/verify_postgres_migrations.sh ]; then
            echo "Running repository scripts/verify_postgres_migrations.sh"
            bash scripts/verify_postgres_migrations.sh
            verifier_mode="scripts/verify_postgres_migrations.sh"
          else
            verifier_mode="inline-sql-and-constraint-checks"
          fi

          pgwire_live_status="not-present"
          pgwire_live_secs="0"
          if [ -f scripts/verify_pgwire_live.sh ]; then
            echo "Running live PostgreSQL 18 ef-pgwire durability proof (scripts/verify_pgwire_live.sh)"
            rustup show active-toolchain
            pgw_start=$(python3 -c 'import time; print(time.time())')
            bash scripts/verify_pgwire_live.sh
            pgw_end=$(python3 -c 'import time; print(time.time())')
            pgwire_live_secs=$(python3 -c "print(round(float('$pgw_end') - float('$pgw_start'), 2))")
            pgwire_live_status="passed"
          fi

          # Always verify isolated Clinic and Mobile schemas, idempotency, and constraints on Postgres 18.
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS ef_clinic_ci;
          DROP DATABASE IF EXISTS ef_mobile_ci;
          CREATE DATABASE ef_clinic_ci;
          CREATE DATABASE ef_mobile_ci;
          SQL

          clinic_files=()
          for sql_file in crates/ef-clinic-server/migrations/*.sql; do
            clinic_files+=("$sql_file")
            psql -d ef_clinic_ci -v ON_ERROR_STOP=1 -f "$sql_file"
            # Re-apply to verify idempotency.
            psql -d ef_clinic_ci -v ON_ERROR_STOP=1 -f "$sql_file"
          done

          mobile_files=()
          for sql_file in crates/ef-mobile-server/migrations/*.sql; do
            mobile_files+=("$sql_file")
            psql -d ef_mobile_ci -v ON_ERROR_STOP=1 -f "$sql_file"
            # Re-apply to verify idempotency.
            psql -d ef_mobile_ci -v ON_ERROR_STOP=1 -f "$sql_file"
          done

          # Clinic schema constraint & cascade checks.
          psql -d ef_clinic_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO practices (practice_id, display_name, created_at_secs)
          VALUES ('prac-1', 'Curie Clinic CI', 1760000000);
          INSERT INTO physician_accounts (physician_id, practice_id, email, display_name, role, standing)
          VALUES ('phys-1', 'prac-1', 'dr@clinic.example', 'Dr. Curie', 'standard', 'active');
          INSERT INTO patient_workspaces (workspace_id, practice_id, display_name)
          VALUES ('ws-1', 'prac-1', 'Patient A');
          INSERT INTO composer_drafts (workspace_id, chat_id, draft_text, revision)
          VALUES ('ws-1', 'chat-1', 'Follow up CBC', 0);

          DO $$
          BEGIN
            BEGIN
              INSERT INTO physician_accounts (physician_id, practice_id, email, display_name, role, standing)
              VALUES ('phys-bad', 'prac-1', 'bad@clinic.example', 'Bad', 'superuser', 'active');
              RAISE EXCEPTION 'expected CHECK constraint failure on role';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO composer_drafts (workspace_id, chat_id, draft_text, revision)
              VALUES ('ws-1', 'chat-neg', 'Invalid', -1);
              RAISE EXCEPTION 'expected CHECK constraint failure on revision';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $$;

          DELETE FROM practices WHERE practice_id = 'prac-1';
          DO $$
          DECLARE remaining integer;
          BEGIN
            SELECT count(*) INTO remaining FROM composer_drafts;
            IF remaining <> 0 THEN
              RAISE EXCEPTION 'expected CASCADE delete to remove dependent drafts, found %', remaining;
            END IF;
          END $$;
          SQL

          # Mobile schema constraint, version, and DDL-less runtime role checks.
          psql -d ef_mobile_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE v integer;
          BEGIN
            SELECT max(version) INTO v FROM schema_migrations;
            IF v IS DISTINCT FROM 1 THEN
              RAISE EXCEPTION 'expected schema_migrations version 1, got %', v;
            END IF;
          END $$;

          INSERT INTO mobile_accounts (account_id, incarnation, email)
          VALUES ('acct-1', 1, 'patient@mobile.example');

          DO $$
          BEGIN
            BEGIN
              INSERT INTO mobile_accounts (account_id, incarnation, email)
              VALUES ('acct-bad', 0, 'bad@mobile.example');
              RAISE EXCEPTION 'expected CHECK constraint failure on incarnation';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO patient_records (
                account_id, record_id, incarnation, version, source_kind_json,
                bucket, confidentiality, original_date, title, summary, native_bytes
              )
              VALUES (
                'acct-1', 'rec-bad', 1, 1, '{}'::jsonb,
                'labs', 'InvalidClass', '2026-10-01', 'Bad', 'Bad', '\x00'::bytea
              );
              RAISE EXCEPTION 'expected CHECK constraint failure on confidentiality';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO push_device_tokens (device_id, account_id, platform, token)
              VALUES ('dev-bad', 'acct-1', 'unknown_os', 'tok');
              RAISE EXCEPTION 'expected CHECK constraint failure on platform';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $$;
          SQL

          clinic_tables=$(psql -d ef_clinic_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          mobile_tables=$(psql -d ef_mobile_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")

          python3 - "$pg_version" "$verifier_mode" "$clinic_tables" "$mobile_tables" "${clinic_files[*]}" "${mobile_files[*]}" "$pgwire_live_status" "$pgwire_live_secs" <<'PY'
          import json, os, sys
          from pathlib import Path

          report = {
              "job": "postgres-18",
              "revision": os.environ.get("GITHUB_SHA", ""),
              "postgres_version": sys.argv[1],
              "verifier_mode": sys.argv[2],
              "pgwire_live": {
                  "script": "scripts/verify_pgwire_live.sh",
                  "status": sys.argv[7],
                  "duration_secs": float(sys.argv[8]),
              },
              "clinic_db": {
                  "migrations": sys.argv[5].split(),
                  "public_table_count": int(sys.argv[3]),
                  "idempotent_reapply": True,
                  "constraints_and_cascade_verified": True,
              },
              "mobile_db": {
                  "migrations": sys.argv[6].split(),
                  "public_table_count": int(sys.argv[4]),
                  "idempotent_reapply": True,
                  "constraints_and_version_verified": True,
              },
              "status": "passed",
          }
          out = Path("cross-platform-evidence/postgres-18.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload PostgreSQL 18 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-postgres-18-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-evidence/postgres-18.json
          if-no-files-found: warn
          retention-days: 30

  browsers-e2e:
    name: Multi-Browser E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install fast Linux linker (lld + clang)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld clang

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Cache Linux Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-browsers-linux-v2
          shared-key: cross-browsers-linux-v2
          cache-on-failure: true

      - name: Build server binaries and release Wasm module for browser E2E
        run: |
          crates="-p ef-clinic-server -p ef-mobile-server"
          if [ -f crates/ef-public-site/src/main.rs ]; then
            crates="${crates} -p ef-public-site"
          fi
          echo "Building browser E2E server binaries: ${crates}"
          # shellcheck disable=SC2086
          cargo build --locked ${crates}

          echo "Compiling release wasm32 cdylib module (m1-web-delivery)"
          env -u RUSTFLAGS cargo rustc --locked --release --target wasm32-unknown-unknown \
            -p m1-web-delivery --lib --crate-type cdylib
          ls -lh target/wasm32-unknown-unknown/release/m1_web_delivery.wasm

          if [ -f crates/ef-clinic-client/src/wasm_abi.rs ]; then
            echo "Compiling release wasm32 cdylib module (ef-clinic-client)"
            env -u RUSTFLAGS cargo rustc --locked --release --target wasm32-unknown-unknown \
              -p ef-clinic-client --lib --crate-type cdylib
            ls -lh target/wasm32-unknown-unknown/release/ef_clinic_client.wasm
          fi

          if [ -f crates/ef-mobile-client/src/wasm_abi.rs ]; then
            echo "Compiling release wasm32 cdylib module (ef-mobile-client)"
            env -u RUSTFLAGS cargo rustc --locked --release --target wasm32-unknown-unknown \
              -p ef-mobile-client --lib --crate-type cdylib
            ls -lh target/wasm32-unknown-unknown/release/ef_mobile_client.wasm
          fi

      - name: Install Playwright (Chromium, Firefox, WebKit) and Brotli
        run: |
          python3 -m venv .venv-pw
          .venv-pw/bin/pip install --quiet --upgrade pip playwright brotli
          .venv-pw/bin/playwright install --with-deps chromium firefox webkit

      - name: Install Noto multilingual fonts for 7-script GUI/UX rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-extra \
            fontconfig
          fc-cache -f

      - name: Run 3-browser E2E qualification suite
        run: |
          mkdir -p cross-platform-evidence
          report_path="cross-platform-evidence/cross-platform-browser-report.json"
          wasm_file="target/wasm32-unknown-unknown/release/m1_web_delivery.wasm"
          clinic_wasm="target/wasm32-unknown-unknown/release/ef_clinic_client.wasm"
          mobile_wasm="target/wasm32-unknown-unknown/release/ef_mobile_client.wasm"

          if [ -f scripts/browser_e2e.py ]; then
            help_text="$(.venv-pw/bin/python scripts/browser_e2e.py --help 2>&1 || true)"
            extra_args=()
            if echo "$help_text" | grep -q -- '--clinic-bin'; then
              extra_args+=(--clinic-bin target/debug/ef-clinic-server)
            fi
            if echo "$help_text" | grep -q -- '--mobile-bin'; then
              extra_args+=(--mobile-bin target/debug/ef-mobile-server)
            fi
            if [ -x target/debug/ef-public-site ] && echo "$help_text" | grep -q -- '--public-bin'; then
              extra_args+=(--public-bin target/debug/ef-public-site)
            fi
            if echo "$help_text" | grep -q -- '--mobile-emulation'; then
              extra_args+=(--mobile-emulation)
            fi
            if [ -f "$wasm_file" ] && echo "$help_text" | grep -q -- '--wasm-file'; then
              extra_args+=(--wasm-file "$wasm_file")
            fi
            if [ -f "$clinic_wasm" ] && echo "$help_text" | grep -q -- '--clinic-wasm'; then
              extra_args+=(--clinic-wasm "$clinic_wasm")
            fi
            if [ -f "$mobile_wasm" ] && echo "$help_text" | grep -q -- '--mobile-wasm'; then
              extra_args+=(--mobile-wasm "$mobile_wasm")
            fi
            .venv-pw/bin/python scripts/browser_e2e.py \
              --browsers chromium,firefox,webkit \
              --report "$report_path" \
              "${extra_args[@]}"
          else
            .venv-pw/bin/python - "$report_path" <<'PY'
          import functools
          import http.server
          import json
          import os
          import socket
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          STRICT_CSP = (
              "default-src 'self'; "
              "script-src 'self' 'wasm-unsafe-eval'; "
              "style-src 'self'; "
              "connect-src 'self'; "
              "object-src 'none'; "
              "frame-ancestors 'none'"
          )

          STUB_WASM_GLUE = (
              "export default async function init() {\n"
              "  return { elysian_m1_delivery_probe: (webgpu, webgl2) => (webgpu || webgl2 ? 0 : 2) };\n"
              "}\n"
          )

          def free_port() -> int:
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.bind(("127.0.0.1", 0))
                  return int(s.getsockname()[1])

          def wait_http(url: str, timeout: float = 15.0) -> int:
              deadline = time.monotonic() + timeout
              last_err = None
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=2.0) as resp:
                          return resp.status
                  except urllib.error.HTTPError as exc:
                      return exc.code
                  except Exception as exc:
                      last_err = exc
                      time.sleep(0.15)
              raise RuntimeError(f"server at {url} did not become ready: {last_err}")

          class QualifyingStaticHandler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, repo_root: Path, **kwargs):
                  self._repo_root = repo_root
                  super().__init__(*args, directory=str(repo_root), **kwargs)

              def log_message(self, format: str, *args) -> None:
                  return

              def end_headers(self) -> None:
                  self.send_header("Content-Security-Policy", STRICT_CSP)
                  self.send_header("Cache-Control", "no-store")
                  super().end_headers()

              def do_GET(self) -> None:
                  if self.path == "/elysianfields" or self.path == "/elysianfields/":
                      self.path = "/web/elysianfields/index.html"
                  elif self.path == "/elysianfields/pkg/m1_web_delivery.js":
                      real = self._repo_root / "web/elysianfields/pkg/m1_web_delivery.js"
                      if not real.is_file():
                          payload = STUB_WASM_GLUE.encode("utf-8")
                          self.send_response(200)
                          self.send_header("Content-Type", "application/javascript; charset=utf-8")
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                          return
                      self.path = "/web/elysianfields/pkg/m1_web_delivery.js"
                  elif self.path.startswith("/elysianfields/"):
                      self.path = "/web" + self.path
                  super().do_GET()

          repo_root = Path.cwd()
          report_path = Path(sys.argv[1])
          has_compiled_wasm = (repo_root / "web/elysianfields/pkg/m1_web_delivery.js").is_file()

          with tempfile.TemporaryDirectory() as tmp:
              tmp_dir = Path(tmp)
              clinic_port = free_port()
              mobile_port = free_port()

              clinic_env = os.environ.copy()
              clinic_env["EF_CLINIC_BIND"] = f"127.0.0.1:{clinic_port}"
              clinic_env["EF_CLINIC_DATA_DIR"] = str(tmp_dir / "clinic-wal")
              clinic_proc = subprocess.Popen(
                  [str(repo_root / "target/debug/ef-clinic-server")],
                  env=clinic_env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              mobile_env = os.environ.copy()
              mobile_env["EF_MOBILE_BIND"] = f"127.0.0.1:{mobile_port}"
              mobile_env["EF_MOBILE_DATA_DIR"] = str(tmp_dir / "mobile-wal")
              mobile_env["EF_MOBILE_JOURNAL_DIR"] = str(tmp_dir / "mobile-journal")
              mobile_proc = subprocess.Popen(
                  [str(repo_root / "target/debug/ef-mobile-server")],
                  env=mobile_env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              static_port = free_port()
              handler = functools.partial(QualifyingStaticHandler, repo_root=repo_root)
              httpd = http.server.ThreadingHTTPServer(("127.0.0.1", static_port), handler)
              server_thread = threading.Thread(target=httpd.serve_forever, daemon=True)
              server_thread.start()

              try:
                  clinic_status = wait_http(f"http://127.0.0.1:{clinic_port}/elysianfields/api/health")
                  mobile_status = wait_http(f"http://127.0.0.1:{mobile_port}/elysianfields/mobile-api/readyz")
                  assert mobile_status == 200, f"expected mobile /readyz 200, got {mobile_status}"

                  browser_results = {}
                  with sync_playwright() as pw:
                      for engine_name in ("chromium", "firefox", "webkit"):
                          browser = getattr(pw, engine_name).launch(headless=True)
                          try:
                              ctx = browser.new_context(viewport={"width": 1280, "height": 800})
                              page = ctx.new_page()

                              # 1. /elysianfields/ surface
                              console_errors = []
                              page_errors = []
                              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
                              page.on("pageerror", lambda err: page_errors.append(str(err)))
                              page.add_init_script(
                                  "window.__efCspViolations = 0; "
                                  "document.addEventListener('securitypolicyviolation', () => { window.__efCspViolations += 1; });"
                              )

                              resp = page.goto(f"http://127.0.0.1:{static_port}/elysianfields/", wait_until="networkidle")
                              assert resp is not None and resp.status == 200, f"{engine_name} /elysianfields/ HTTP {resp.status if resp else None}"
                              page.wait_for_function("() => Boolean(document.documentElement.dataset.m1Ready)", timeout=10000)

                              web_metrics = page.evaluate(
                                  """() => {
                                    const main = document.querySelector('main#elysian-app');
                                    const rect = main ? main.getBoundingClientRect() : null;
                                    const nav = performance.getEntriesByType('navigation')[0];
                                    return {
                                      ready: document.documentElement.dataset.m1Ready || '',
                                      mountPrefix: main ? main.getAttribute('data-mount-prefix') : '',
                                      textLen: (document.body.innerText || '').trim().length,
                                      width: rect ? rect.width : 0,
                                      height: rect ? rect.height : 0,
                                      cspViolations: window.__efCspViolations || 0,
                                      domContentLoadedMs: nav ? Math.round(nav.domContentLoadedEventEnd * 100) / 100 : 0,
                                    };
                                  }"""
                              )
                              page.focus("#composer-draft")
                              active_id = page.evaluate("() => document.activeElement ? document.activeElement.id : ''")
                              assert active_id == "composer-draft", f"{engine_name} focus failed: {active_id}"
                              assert web_metrics["mountPrefix"] == "/elysianfields"
                              assert web_metrics["textLen"] > 20 and web_metrics["width"] > 0 and web_metrics["height"] > 0
                              assert web_metrics["cspViolations"] == 0, f"{engine_name} CSP violations: {web_metrics}"
                              assert not console_errors, f"{engine_name} /elysianfields/ console errors: {console_errors}"
                              assert not page_errors, f"{engine_name} /elysianfields/ page errors: {page_errors}"

                              # 2. Chrome MV3 extension/popup.html surface
                              popup_page = ctx.new_page()
                              popup_console_errors = []
                              popup_page_errors = []
                              popup_page.on("console", lambda msg: popup_console_errors.append(msg.text) if msg.type == "error" else None)
                              popup_page.on("pageerror", lambda err: popup_page_errors.append(str(err)))
                              popup_page.add_init_script(
                                  "window.__efCspViolations = 0; "
                                  "document.addEventListener('securitypolicyviolation', () => { window.__efCspViolations += 1; });"
                              )
                              popup_resp = popup_page.goto(f"http://127.0.0.1:{static_port}/extension/popup.html", wait_until="load")
                              assert popup_resp is not None and popup_resp.status == 200
                              popup_metrics = popup_page.evaluate(
                                  """() => {
                                    const nav = performance.getEntriesByType('navigation')[0];
                                    return {
                                      hasMain: Boolean(document.querySelector('main.popup-shell')),
                                      hasHeader: Boolean(document.querySelector('header.popup-header')),
                                      sections: document.querySelectorAll('section').length,
                                      statusText: (document.getElementById('connector-status')?.textContent || '').trim(),
                                      cspViolations: window.__efCspViolations || 0,
                                      domContentLoadedMs: nav ? Math.round(nav.domContentLoadedEventEnd * 100) / 100 : 0,
                                    };
                                  }"""
                              )
                              assert popup_metrics["hasMain"] and popup_metrics["hasHeader"] and popup_metrics["sections"] >= 2
                              assert popup_metrics["cspViolations"] == 0
                              assert popup_metrics["domContentLoadedMs"] <= 250.0, f"{engine_name} popup DCL > 250ms: {popup_metrics}"
                              assert not popup_console_errors, f"{engine_name} popup console errors: {popup_console_errors}"
                              assert not popup_page_errors, f"{engine_name} popup page errors: {popup_page_errors}"

                              browser_results[engine_name] = {
                                  "version": browser.version,
                                  "status": "passed",
                                  "elysianfields": web_metrics,
                                  "extension_popup": popup_metrics,
                              }
                              ctx.close()
                          finally:
                              browser.close()

                  report = {
                      "job": "browsers-e2e",
                      "runner_mode": "fallback-inline-playwright",
                      "wasm_bundle_mode": "compiled" if has_compiled_wasm else "stub-probe",
                      "revision": os.environ.get("GITHUB_SHA", ""),
                      "servers": {
                          "ef_clinic_server_http_status": clinic_status,
                          "ef_mobile_server_readyz_status": mobile_status,
                      },
                      "browsers": browser_results,
                      "status": "passed",
                  }
                  report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
                  print(report_path.read_text(encoding="utf-8"))
              finally:
                  httpd.shutdown()
                  for proc in (clinic_proc, mobile_proc):
                      proc.terminate()
                      try:
                          proc.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          proc.kill()
          PY
          fi

      - name: Verify real WebAssembly.compile under strict CSP & record Brotli-11 byte size
        run: |
          mkdir -p cross-platform-evidence
          wasm_file="target/wasm32-unknown-unknown/release/m1_web_delivery.wasm"
          out_path="cross-platform-evidence/wasm-brotli-report.json"
          .venv-pw/bin/python - "$wasm_file" "$out_path" <<'PY'
          import brotli
          import functools
          import http.server
          import json
          import os
          import socket
          import sys
          import threading
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          STRICT_CSP = (
              "default-src 'self'; "
              "script-src 'self' 'wasm-unsafe-eval'; "
              "style-src 'self'; "
              "connect-src 'self'; "
              "object-src 'none'; "
              "frame-ancestors 'none'"
          )

          PROBE_HTML = (
              "<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'>"
              "<title>Wasm CSP Probe</title></head><body>"
              "<script src='/elysianfields/wasm-probe.js'></script>"
              "</body></html>"
          ).encode("utf-8")

          PROBE_JS = (
              "window.__wasmCspViolations = 0;\n"
              "document.addEventListener('securitypolicyviolation', () => { window.__wasmCspViolations += 1; });\n"
              "(async () => {\n"
              "  const t0 = performance.now();\n"
              "  const resp = await fetch('/elysianfields/m1_web_delivery.wasm');\n"
              "  const bytes = await resp.arrayBuffer();\n"
              "  const mod = await WebAssembly.compile(bytes);\n"
              "  window.__wasmProbeResult = {\n"
              "    ok: mod instanceof WebAssembly.Module,\n"
              "    byteLength: bytes.byteLength,\n"
              "    compileMs: Math.round((performance.now() - t0) * 100) / 100,\n"
              "    exportCount: WebAssembly.Module.exports(mod).length,\n"
              "    cspViolations: window.__wasmCspViolations,\n"
              "  };\n"
              "})().catch((err) => { window.__wasmProbeResult = { ok: false, error: String(err) }; });\n"
          ).encode("utf-8")

          wasm_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          wasm_bytes = wasm_path.read_bytes()
          brotli_bytes = brotli.compress(wasm_bytes, quality=11)

          class WasmProbeHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format: str, *args) -> None:
                  return

              def do_GET(self) -> None:
                  if self.path == "/elysianfields/":
                      body, ctype = PROBE_HTML, "text/html; charset=utf-8"
                  elif self.path == "/elysianfields/wasm-probe.js":
                      body, ctype = PROBE_JS, "application/javascript; charset=utf-8"
                  elif self.path == "/elysianfields/m1_web_delivery.wasm":
                      body, ctype = wasm_bytes, "application/wasm"
                  else:
                      self.send_response(404)
                      self.end_headers()
                      return
                  self.send_response(200)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Content-Security-Policy", STRICT_CSP)
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 0))
              port = int(s.getsockname()[1])

          httpd = http.server.ThreadingHTTPServer(("127.0.0.1", port), WasmProbeHandler)
          thread = threading.Thread(target=httpd.serve_forever, daemon=True)
          thread.start()

          engines = {}
          try:
              with sync_playwright() as pw:
                  for engine_name in ("chromium", "firefox", "webkit"):
                      browser = getattr(pw, engine_name).launch(headless=True)
                      try:
                          ctx = browser.new_context()
                          page = ctx.new_page()
                          console_errors = []
                          page_errors = []
                          page.on("console", lambda m: console_errors.append(m.text) if m.type == "error" else None)
                          page.on("pageerror", lambda e: page_errors.append(str(e)))
                          page.goto(f"http://127.0.0.1:{port}/elysianfields/", wait_until="load")
                          page.wait_for_function("() => Boolean(window.__wasmProbeResult)", timeout=15000)
                          res = page.evaluate("() => window.__wasmProbeResult")
                          assert res.get("ok") is True, f"{engine_name} WebAssembly.compile failed: {res}"
                          assert res.get("cspViolations") == 0, f"{engine_name} CSP violations: {res}"
                          assert not console_errors, f"{engine_name} console errors: {console_errors}"
                          assert not page_errors, f"{engine_name} page errors: {page_errors}"
                          engines[engine_name] = {
                              "version": browser.version,
                              **res,
                          }
                          ctx.close()
                      finally:
                          browser.close()
          finally:
              httpd.shutdown()

          extra_wasm_sizes = {}
          for label, rel in (
              ("ef_clinic_client", "target/wasm32-unknown-unknown/release/ef_clinic_client.wasm"),
              ("ef_mobile_client", "target/wasm32-unknown-unknown/release/ef_mobile_client.wasm"),
          ):
              p = Path(rel)
              if p.is_file():
                  raw = p.read_bytes()
                  br = brotli.compress(raw, quality=11)
                  extra_wasm_sizes[label] = {
                      "artifact": rel,
                      "raw_bytes": len(raw),
                      "brotli_11_bytes": len(br),
                      "brotli_11_kib": round(len(br) / 1024.0, 2),
                  }

          report = {
              "job": "browsers-e2e-wasm-csp",
              "revision": os.environ.get("GITHUB_SHA", ""),
              "wasm_artifact": str(wasm_path),
              "raw_bytes": len(wasm_bytes),
              "brotli_11_bytes": len(brotli_bytes),
              "brotli_11_kib": round(len(brotli_bytes) / 1024.0, 2),
              "client_wasm_artifacts": extra_wasm_sizes,
              "strict_csp": STRICT_CSP,
              "engines": engines,
              "status": "passed",
          }
          out_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out_path.read_text(encoding="utf-8"))
          PY

      - name: Run 7-script multilingual GUI/UX QA across Chromium, Firefox, and WebKit
        run: |
          mkdir -p cross-platform-evidence
          if [ -f scripts/qa_multilingual_gui.py ]; then
            .venv-pw/bin/python scripts/qa_multilingual_gui.py \
              --browsers chromium,firefox,webkit \
              --clinic-bin target/debug/ef-clinic-server \
              --mobile-bin target/debug/ef-mobile-server \
              --clinic-wasm target/wasm32-unknown-unknown/release/ef_clinic_client.wasm \
              --mobile-wasm target/wasm32-unknown-unknown/release/ef_mobile_client.wasm \
              --report cross-platform-evidence/multilingual-gui-qa-report.json \
              --screenshot-dir cross-platform-evidence/multilingual-screenshots
          else
            echo "scripts/qa_multilingual_gui.py not present yet; skipping multilingual GUI QA."
          fi

      - name: Run WCAG AA theme, 200% zoom, Privacy Cover & Dei UX QA across Chromium, Firefox, and WebKit
        run: |
          mkdir -p cross-platform-evidence
          if [ -f scripts/qa_ux_accessibility.py ]; then
            .venv-pw/bin/python scripts/qa_ux_accessibility.py \
              --browsers chromium,firefox,webkit \
              --clinic-bin target/debug/ef-clinic-server \
              --mobile-bin target/debug/ef-mobile-server \
              --public-bin target/debug/ef-public-site \
              --report cross-platform-evidence/ux-accessibility-qa-report.json \
              --screenshot-dir cross-platform-evidence/ux-screenshots
          else
            echo "scripts/qa_ux_accessibility.py not present yet; skipping UX/accessibility QA."
          fi

      - name: Upload 3-browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-browsers-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cross-platform-evidence/cross-platform-browser-report.json
            cross-platform-evidence/wasm-brotli-report.json
            cross-platform-evidence/multilingual-gui-qa-report.json
            cross-platform-evidence/multilingual-screenshots/
            cross-platform-evidence/ux-accessibility-qa-report.json
            cross-platform-evidence/ux-screenshots/
          if-no-files-found: warn
          retention-days: 30

  mobile-android-build:
    name: Mobile Android ARM64 cross-check & Kotlin audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain with aarch64-linux-android target
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Cache Android Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-android-arm64-v2
          shared-key: cross-android-arm64-v2
          cache-on-failure: true

      - name: Cross-check Android mobile crates (aarch64-linux-android)
        run: |
          mkdir -p cross-platform-evidence
          ndk_root="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -n "$ndk_root" ] && [ -d "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            ndk_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
            clang_bin="$(ls -1 "$ndk_bin"/aarch64-linux-android*-clang | sort -V | tail -n 1)"
            clangxx_bin="$(ls -1 "$ndk_bin"/aarch64-linux-android*-clang++ | sort -V | tail -n 1)"
            export CC_aarch64_linux_android="$clang_bin"
            export CXX_aarch64_linux_android="$clangxx_bin"
            export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$clang_bin"
            echo "Using Android NDK toolchain: $clang_bin"
          else
            echo "Android NDK not found; falling back to pure-Rust blake3 if needed"
          fi
          start_ts=$(python3 -c 'import time; print(time.time())')
          cargo check --locked --target aarch64-linux-android \
            -p ef-core \
            -p ef-connected-care \
            -p ef-mobile-domain \
            -p m1-mobile-lifecycle \
            -p ef-mobile-client
          end_ts=$(python3 -c 'import time; print(time.time())')
          python3 - "$start_ts" "$end_ts" <<'PY'
          import json, sys
          from pathlib import Path
          elapsed = round(float(sys.argv[2]) - float(sys.argv[1]), 2)
          Path("cross-platform-evidence/android-rust-check.json").write_text(
              json.dumps(
                  {
                      "status": "passed",
                      "target": "aarch64-linux-android",
                      "crates": [
                          "ef-core",
                          "ef-connected-care",
                          "ef-mobile-domain",
                          "m1-mobile-lifecycle",
                          "ef-mobile-client",
                      ],
                      "duration_secs": elapsed,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify Android Kotlin shims & execute Kotlin EFSS tests (kotlinc + java)
        run: |
          mkdir -p cross-platform-evidence
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, tempfile, time
          from pathlib import Path

          android_dir = Path("platform/android")
          main_dir = android_dir / "src" / "main" / "kotlin"
          test_dir = android_dir / "src" / "test" / "kotlin"
          kt_files = sorted(android_dir.rglob("*.kt")) if android_dir.is_dir() else []
          main_kt = sorted(main_dir.rglob("*.kt")) if main_dir.is_dir() else kt_files
          test_kt = sorted(test_dir.rglob("*.kt")) if test_dir.is_dir() else []

          result: dict = {
              "platform_dir_present": android_dir.is_dir(),
              "kotlin_files": [p.as_posix() for p in kt_files],
              "test_files": [p.as_posix() for p in test_kt],
              "mode": "not-present",
              "status": "not-present",
              "kotlin_test_execution": {"status": "not-present"},
          }

          if kt_files:
              issues = []
              for kt in kt_files:
                  text = kt.read_text(encoding="utf-8")
                  if not text.strip():
                      issues.append(f"{kt.as_posix()}: empty file")
                  if not re.search(r"^\s*package\s+[A-Za-z0-9_.]+\s*$", text, flags=re.MULTILINE):
                      issues.append(f"{kt.as_posix()}: missing package declaration")
                  if re.search(r"\bTYL-[0-9]+\b", text):
                      issues.append(f"{kt.as_posix()}: forbidden ticket ID")
              if issues:
                  raise SystemExit("Android Kotlin structural audit failed:\n" + "\n".join(issues))

              kotlinc = shutil.which("kotlinc")
              java = shutil.which("java")
              if kotlinc:
                  proc = subprocess.run(
                      [kotlinc, "-nowarn", *[str(p) for p in main_kt]],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  result["mode"] = "kotlinc-and-structural"
                  result["kotlinc_exit_code"] = proc.returncode
                  result["kotlinc_stderr_tail"] = proc.stderr.splitlines()[-20:]
                  result["status"] = "passed" if proc.returncode == 0 else "structural-only-sdk-needed"

                  if test_kt:
                      if not java:
                          raise SystemExit("kotlinc found and Kotlin tests exist, but java runtime is missing")
                      with tempfile.TemporaryDirectory() as tmp:
                          jar_path = Path(tmp) / "elysian-mobile-shim-tests.jar"
                          t0 = time.monotonic()
                          compile_test = subprocess.run(
                              [
                                  kotlinc,
                                  "-nowarn",
                                  "-include-runtime",
                                  "-d",
                                  str(jar_path),
                                  *[str(p) for p in main_kt],
                                  *[str(p) for p in test_kt],
                              ],
                              capture_output=True,
                              text=True,
                              check=False,
                          )
                          if compile_test.returncode != 0:
                              raise SystemExit(
                                  "Kotlin test compilation failed:\n"
                                  + compile_test.stdout
                                  + "\n"
                                  + compile_test.stderr
                              )

                          # Locate main class from test file (e.g. fields.elysian.mobile.ElysianMobileShimTestKt).
                          run_proc = subprocess.run(
                              [java, "-jar", str(jar_path)],
                              capture_output=True,
                              text=True,
                              check=False,
                          )
                          if run_proc.returncode != 0 and "no main manifest attribute" in run_proc.stderr:
                              primary = test_kt[0]
                              pkg_match = re.search(
                                  r"^\s*package\s+([A-Za-z0-9_.]+)\s*$",
                                  primary.read_text(encoding="utf-8"),
                                  flags=re.MULTILINE,
                              )
                              pkg = f"{pkg_match.group(1)}." if pkg_match else ""
                              main_cls = f"{pkg}{primary.stem}Kt"
                              run_proc = subprocess.run(
                                  [java, "-cp", str(jar_path), main_cls],
                                  capture_output=True,
                                  text=True,
                                  check=False,
                              )

                          elapsed = round(time.monotonic() - t0, 2)
                          result["kotlin_test_execution"] = {
                              "status": "passed" if run_proc.returncode == 0 else "failed",
                              "exit_code": run_proc.returncode,
                              "duration_secs": elapsed,
                              "stdout_tail": run_proc.stdout.splitlines()[-20:],
                              "stderr_tail": run_proc.stderr.splitlines()[-20:],
                          }
                          if run_proc.returncode != 0:
                              raise SystemExit(
                                  "Kotlin EFSS test execution failed:\n"
                                  + run_proc.stdout
                                  + "\n"
                                  + run_proc.stderr
                              )
              else:
                  result["mode"] = "structural-audit"
                  result["status"] = "passed"

          Path("cross-platform-evidence/android-kotlin-audit.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Assemble Android qualification JSON report
        if: always()
        run: |
          mkdir -p cross-platform-evidence
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def load_opt(path: str) -> dict:
              p = Path(path)
              return json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {"status": "not-run"}

          report = {
              "job": "mobile-android-build",
              "revision": os.environ.get("GITHUB_SHA", ""),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "rust_cross_check": load_opt("cross-platform-evidence/android-rust-check.json"),
              "kotlin_verification": load_opt("cross-platform-evidence/android-kotlin-audit.json"),
          }
          out = Path("cross-platform-evidence/mobile-android-build.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload Android cross-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-mobile-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-evidence/mobile-android-build.json
          if-no-files-found: warn
          retention-days: 30

  oci-container-build:
    name: Rootless OCI Container Builds & Smoke (public, clinic, mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and smoke-test all 3 rootless OCI images (public, clinic, mobile)
        run: |
          mkdir -p cross-platform-evidence
          public_tag="elysian-public:ci-${GITHUB_RUN_ID}"
          clinic_tag="elysian-clinic:ci-${GITHUB_RUN_ID}"
          mobile_tag="elysian-mobile:ci-${GITHUB_RUN_ID}"

          public_cid=""
          clinic_cid=""
          mobile_cid=""
          cleanup_containers() {
            for cid in "$public_cid" "$clinic_cid" "$mobile_cid"; do
              [ -n "$cid" ] && docker rm -f "$cid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_containers EXIT

          build_and_check_identity() {
            local cf="$1"
            local tag="$2"
            local out_var_secs="$3"
            local out_var_bytes="$4"
            local start_ts end_ts secs bytes uid gid
            start_ts=$(python3 -c 'import time; print(time.time())')
            docker build -f "$cf" -t "$tag" .
            end_ts=$(python3 -c 'import time; print(time.time())')
            secs=$(python3 -c "print(round(float('$end_ts') - float('$start_ts'), 2))")
            bytes=$(docker image inspect --format '{{.Size}}' "$tag")
            uid=$(docker run --rm --entrypoint /usr/bin/id "$tag" -u)
            gid=$(docker run --rm --entrypoint /usr/bin/id "$tag" -g)
            echo "${cf} (${tag}): build=${secs}s size=${bytes}B uid=${uid} gid=${gid}"
            if [ "$uid" != "10001" ] || [ "$gid" != "10001" ]; then
              echo "ERROR: ${cf} expected rootless UID/GID 10001:10001, got ${uid}:${gid}" >&2
              exit 1
            fi
            printf -v "$out_var_secs" '%s' "$secs"
            printf -v "$out_var_bytes" '%s' "$bytes"
          }

          build_and_check_identity deploy/Containerfile.public "$public_tag" public_secs public_bytes
          build_and_check_identity deploy/Containerfile.clinic "$clinic_tag" clinic_secs clinic_bytes
          build_and_check_identity deploy/Containerfile.mobile "$mobile_tag" mobile_secs mobile_bytes

          public_cid=$(docker run -d \
            --name "elysian-public-ci-${GITHUB_RUN_ID}" \
            --read-only \
            --user 10001:10001 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 127.0.0.1:18082:8082 \
            "$public_tag")

          clinic_cid=$(docker run -d \
            --name "elysian-clinic-ci-${GITHUB_RUN_ID}" \
            --read-only \
            --tmpfs /var/lib/elysian/clinic:uid=10001,gid=10001 \
            --user 10001:10001 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 127.0.0.1:18088:8088 \
            "$clinic_tag")

          mobile_cid=$(docker run -d \
            --name "elysian-mobile-ci-${GITHUB_RUN_ID}" \
            --read-only \
            --tmpfs /var/lib/elysian/mobile-data:uid=10001,gid=10001 \
            --tmpfs /var/lib/elysian/mobile-journal:uid=10001,gid=10001 \
            --user 10001:10001 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 127.0.0.1:18089:8089 \
            "$mobile_tag")

          python3 - \
            "$public_tag" "$public_secs" "$public_bytes" \
            "$clinic_tag" "$clinic_secs" "$clinic_bytes" \
            "$mobile_tag" "$mobile_secs" "$mobile_bytes" <<'PY'
          import http.client
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          def fetch(base: str, path: str, timeout: float = 15.0) -> tuple[int, dict[str, str], str]:
              deadline = time.monotonic() + timeout
              last_err = None
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(f"{base}{path}", timeout=2.0) as resp:
                          headers = {k.lower(): v for k, v in resp.headers.items()}
                          return resp.status, headers, resp.read().decode("utf-8", errors="replace")
                  except urllib.error.HTTPError as exc:
                      headers = {k.lower(): v for k, v in exc.headers.items()}
                      return exc.code, headers, exc.read().decode("utf-8", errors="replace")
                  except Exception as exc:
                      last_err = exc
                      time.sleep(0.15)
              raise RuntimeError(f"timed out waiting for {base}{path}: {last_err}")

          def fetch_raw_path(host: str, port: int, raw_path: str) -> int:
              conn = http.client.HTTPConnection(host, port, timeout=2.0)
              try:
                  conn.request("GET", raw_path)
                  resp = conn.getresponse()
                  resp.read()
                  return resp.status
              finally:
                  conn.close()

          # 1. Public site container (`deploy/Containerfile.public`)
          pub_base = "http://127.0.0.1:18082"
          health_code, _, _ = fetch(pub_base, "/health")
          readyz_code, _, _ = fetch(pub_base, "/readyz")
          root_code, _, _ = fetch(pub_base, "/")
          dei_code, _, dei_body = fetch(pub_base, "/dei")
          invite_code, invite_headers, invite_body = fetch(pub_base, "/invite")
          grafana_code, grafana_headers, _ = fetch(pub_base, "/grafana/")

          assert health_code == 200, f"/health expected 200, got {health_code}"
          assert readyz_code == 200, f"/readyz expected 200, got {readyz_code}"
          assert root_code == 200, f"/ expected 200, got {root_code}"
          assert dei_code == 200, f"/dei expected 200, got {dei_code}"
          idx_988 = dei_body.find("988")
          idx_911 = dei_body.find("911")
          idx_samhsa = dei_body.find("SAMHSA")
          markers = [
              dei_body.find(m)
              for m in ('id="facilities"', 'data-facility-id="', 'id="state-directory"', 'class="facility')
              if dei_body.find(m) >= 0
          ]
          assert idx_988 >= 0 and idx_911 >= 0 and idx_samhsa >= 0, "missing crisis lines on /dei"
          assert markers, "missing facility listing markers on /dei"
          assert max(idx_988, idx_911, idx_samhsa) < min(markers), "crisis lines must precede facilities"

          assert invite_code == 200, f"/invite expected 200, got {invite_code}"
          robots = invite_headers.get("x-robots-tag", "").lower() + " " + invite_body.lower()
          assert "noindex" in robots and "nofollow" in robots, "/invite missing noindex/nofollow"

          assert grafana_code == 404, f"/grafana/ expected 404, got {grafana_code}"
          assert "no-store" in grafana_headers.get("cache-control", "").lower(), "/grafana/ missing no-store"

          # 2. Curie Clinic container (`deploy/Containerfile.clinic`)
          clinic_base = "http://127.0.0.1:18088"
          clinic_root_code, clinic_headers, clinic_body = fetch(clinic_base, "/elysianfields/")
          clinic_js_code, _, _ = fetch(clinic_base, "/elysianfields/boot.js")
          clinic_outside_code, _, _ = fetch(clinic_base, "/")
          clinic_api_unauth_code, _, _ = fetch(clinic_base, "/elysianfields/api/patients")
          clinic_health_code, _, _ = fetch(clinic_base, "/elysianfields/api/health")
          clinic_traversal_code = fetch_raw_path("127.0.0.1", 18088, "/elysianfields/../Cargo.toml")

          assert clinic_root_code == 200, f"clinic /elysianfields/ expected 200, got {clinic_root_code}"
          clinic_csp = clinic_headers.get("content-security-policy", "")
          assert "default-src 'self'" in clinic_csp and "'wasm-unsafe-eval'" in clinic_csp, f"clinic CSP mismatch: {clinic_csp!r}"
          assert "/elysianfields" in clinic_body, "clinic HTML missing /elysianfields reference"
          assert clinic_js_code == 200, f"clinic /elysianfields/boot.js expected 200, got {clinic_js_code}"
          assert clinic_outside_code == 404, f"clinic / outside mount expected 404, got {clinic_outside_code}"
          assert clinic_api_unauth_code == 401, f"clinic unauth API expected 401, got {clinic_api_unauth_code}"
          assert clinic_traversal_code in (400, 404), f"clinic traversal expected 400/404, got {clinic_traversal_code}"

          # 3. Curie Mobile container (`deploy/Containerfile.mobile`)
          mobile_base = "http://127.0.0.1:18089"
          mobile_readyz_code, _, mobile_readyz_body = fetch(mobile_base, "/elysianfields/mobile-api/readyz")
          mobile_outside_code, _, _ = fetch(mobile_base, "/")
          assert mobile_readyz_code == 200, f"mobile /readyz expected 200, got {mobile_readyz_code}"
          mobile_readyz_json = json.loads(mobile_readyz_body)
          assert mobile_readyz_json.get("ready") is True, f"mobile readyz not ready: {mobile_readyz_json}"
          assert mobile_readyz_json.get("restore_replay_verified") is True, (
              f"mobile readyz missing restore_replay_verified: {mobile_readyz_json}"
          )
          assert mobile_outside_code == 404, f"mobile / outside mount expected 404, got {mobile_outside_code}"

          report = {
              "job": "oci-container-build",
              "revision": os.environ.get("GITHUB_SHA", ""),
              "runtime_uid": 10001,
              "runtime_gid": 10001,
              "hardening": {
                  "read_only": True,
                  "no_new_privileges": True,
                  "cap_drop": ["ALL"],
              },
              "services": {
                  "public": {
                      "containerfile": "deploy/Containerfile.public",
                      "image_tag": sys.argv[1],
                      "build_duration_secs": float(sys.argv[2]),
                      "image_bytes": int(sys.argv[3]),
                      "checks": {
                          "health_status": health_code,
                          "readyz_status": readyz_code,
                          "root_status": root_code,
                          "dei_status": dei_code,
                          "dei_crisis_lines_before_facilities": True,
                          "invite_status": invite_code,
                          "invite_noindex_nofollow": True,
                          "grafana_status": grafana_code,
                          "grafana_no_store": True,
                      },
                  },
                  "clinic": {
                      "containerfile": "deploy/Containerfile.clinic",
                      "image_tag": sys.argv[4],
                      "build_duration_secs": float(sys.argv[5]),
                      "image_bytes": int(sys.argv[6]),
                      "checks": {
                          "subpath_status": clinic_root_code,
                          "strict_csp": True,
                          "boot_js_status": clinic_js_code,
                          "outside_mount_status": clinic_outside_code,
                          "unauth_api_status": clinic_api_unauth_code,
                          "api_health_probe_status": clinic_health_code,
                          "traversal_rejected_status": clinic_traversal_code,
                      },
                  },
                  "mobile": {
                      "containerfile": "deploy/Containerfile.mobile",
                      "image_tag": sys.argv[7],
                      "build_duration_secs": float(sys.argv[8]),
                      "image_bytes": int(sys.argv[9]),
                      "checks": {
                          "readyz_status": mobile_readyz_code,
                          "readyz_payload": mobile_readyz_json,
                          "outside_mount_status": mobile_outside_code,
                      },
                  },
              },
              "status": "passed",
          }
          out = Path("cross-platform-evidence/oci-container-build.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

          for cid in "$public_cid" "$clinic_cid" "$mobile_cid"; do
            docker stop "$cid" >/dev/null
            docker rm -f "$cid" >/dev/null 2>&1 || true
          done
          trap - EXIT
          echo "All 3 rootless OCI containers verified and torn down cleanly."

      - name: Upload OCI container qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-oci-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-evidence/oci-container-build.json
          if-no-files-found: warn
          retention-days: 30
