name: Release Desktop & Web Bundles

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional release version override (without leading v) for manual runs'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Determine release tag and version string
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
            tag="v${version}"
          else
            version="0.1.0-${GITHUB_SHA:0:7}"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version=${version} tag=${tag}"

  package-desktop-linux:
    name: Package Desktop Linux x86_64
    needs: [resolve-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux linker and Bevy desktop GUI libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            lld \
            clang \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libvulkan-dev \
            libudev-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Linux desktop Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-desktop-linux-v2
          shared-key: cross-desktop-linux-v2
          cache-on-failure: true

      - name: Build, smoke-test, and package Linux x86_64 desktop bundle
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cargo build --locked --release -p ef-clinic-desktop -p ef-mobile-desktop
          ./target/release/ef-clinic-desktop --headless-smoke
          ./target/release/ef-mobile-desktop --headless-smoke
          python3 scripts/package_desktop.py \
            --platform linux-x86_64 \
            --version "${RELEASE_VERSION}" \
            --clinic-bin target/release/ef-clinic-desktop \
            --mobile-bin target/release/ef-mobile-desktop \
            --out-dir dist/linux-x86_64
          python3 scripts/package_desktop.py --verify --out-dir dist/linux-x86_64

      - name: Upload Linux x86_64 release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-linux-x86_64
          path: dist/linux-x86_64/
          if-no-files-found: error
          retention-days: 14

  package-desktop-macos:
    name: Package Desktop macOS ARM64
    needs: [resolve-version]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache macOS Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-macos-arm64-v2
          shared-key: cross-macos-arm64-v2
          cache-on-failure: true

      - name: Build, smoke-test, and package macOS ARM64 desktop bundle
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cargo build --locked --release -p ef-clinic-desktop -p ef-mobile-desktop
          ./target/release/ef-clinic-desktop --headless-smoke
          ./target/release/ef-mobile-desktop --headless-smoke
          python3 scripts/package_desktop.py \
            --platform macos-arm64 \
            --version "${RELEASE_VERSION}" \
            --clinic-bin target/release/ef-clinic-desktop \
            --mobile-bin target/release/ef-mobile-desktop \
            --out-dir dist/macos-arm64
          python3 scripts/package_desktop.py --verify --out-dir dist/macos-arm64

      - name: Upload macOS ARM64 release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-macos-arm64
          path: dist/macos-arm64/
          if-no-files-found: error
          retention-days: 14

  package-desktop-windows:
    name: Package Desktop Windows x86_64 MSVC
    needs: [resolve-version]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Windows Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-windows-msvc-v2
          shared-key: cross-windows-msvc-v2
          cache-on-failure: true

      - name: Build, smoke-test, and package Windows x86_64 desktop bundle
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PY=$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          cargo build --locked --release -p ef-clinic-desktop -p ef-mobile-desktop
          ./target/release/ef-clinic-desktop.exe --headless-smoke
          ./target/release/ef-mobile-desktop.exe --headless-smoke
          $PY scripts/package_desktop.py \
            --platform windows-x86_64 \
            --version "${RELEASE_VERSION}" \
            --clinic-bin target/release/ef-clinic-desktop.exe \
            --mobile-bin target/release/ef-mobile-desktop.exe \
            --out-dir dist/windows-x86_64
          $PY scripts/package_desktop.py --verify --out-dir dist/windows-x86_64

      - name: Upload Windows x86_64 release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows-x86_64
          path: dist/windows-x86_64/
          if-no-files-found: error
          retention-days: 14

  package-wasm-web:
    name: Package Wasm /elysianfields Static Client Bundle
    needs: [resolve-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain with wasm32 target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache wasm32 Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-v3
          shared-key: wasm32-v3
          cache-on-failure: true

      - name: Build release Wasm modules and package /elysianfields static bundle
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cargo rustc --locked --release --target wasm32-unknown-unknown \
            -p m1-web-delivery --lib --crate-type cdylib
          cargo rustc --locked --release --target wasm32-unknown-unknown \
            -p ef-clinic-client --lib --crate-type cdylib
          cargo rustc --locked --release --target wasm32-unknown-unknown \
            -p ef-mobile-client --lib --crate-type cdylib

          python3 - "${RELEASE_VERSION}" <<'PY'
          import hashlib
          import io
          import json
          import os
          import sys
          import tarfile
          from pathlib import Path

          ver = sys.argv[1]
          out_dir = Path("dist/wasm-web")
          out_dir.mkdir(parents=True, exist_ok=True)
          archive_name = f"elysian-fields-web-{ver}-elysianfields.tar.gz"
          archive_path = out_dir / archive_name

          entries: list[tuple[str, bytes]] = []
          web_dir = Path("web/elysianfields")
          for item in sorted(web_dir.rglob("*")):
              if item.is_file():
                  rel = item.relative_to(web_dir).as_posix()
                  entries.append((f"elysianfields/{rel}", item.read_bytes()))

          for wasm_name in ("m1_web_delivery.wasm", "ef_clinic_client.wasm", "ef_mobile_client.wasm"):
              wasm_path = Path("target/wasm32-unknown-unknown/release") / wasm_name
              assert wasm_path.is_file(), f"missing compiled Wasm module: {wasm_path}"
              entries.append((f"elysianfields/pkg/{wasm_name}", wasm_path.read_bytes()))

          manifest_assets = [
              {
                  "path": f"/{arcname}",
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
              for arcname, data in entries
          ]
          asset_manifest = json.dumps(
              {
                  "mount_path": "/elysianfields",
                  "version": ver,
                  "revision": os.environ.get("GITHUB_SHA", ""),
                  "assets": manifest_assets,
              },
              indent=2,
          ).encode("utf-8") + b"\n"
          entries.append(("elysianfields/asset-manifest.json", asset_manifest))

          with tarfile.open(archive_path, mode="w:gz", format=tarfile.PAX_FORMAT) as tar:
              for arcname, data in sorted(entries, key=lambda pair: pair[0]):
                  info = tarfile.TarInfo(name=arcname)
                  info.size = len(data)
                  info.mode = 0o644
                  info.mtime = 0
                  info.uid = 0
                  info.gid = 0
                  tar.addfile(info, io.BytesIO(data))

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          (out_dir / "SHA256SUMS.txt").write_text(f"{digest}  {archive_name}\n", encoding="utf-8")
          print(f"Packaged {archive_name} ({archive_path.stat().st_size} B, sha256={digest})")
          PY

      - name: Upload Wasm static client release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm-web
          path: dist/wasm-web/
          if-no-files-found: error
          retention-days: 14

  cargo-deny:
    name: Pre-release cargo-deny gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check advisories, bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources

  publish-release:
    name: Aggregate SHA256SUMS, SBOM & Publish GitHub Release
    needs:
      - resolve-version
      - cargo-deny
      - package-desktop-linux
      - package-desktop-macos
      - package-desktop-windows
      - package-wasm-web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all platform release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-stage

      - name: Generate and verify deterministic CycloneDX 1.5 SBOM
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p release-assets
          sbom_file="release-assets/elysian-fields-${RELEASE_VERSION}-sbom.cdx.json"
          python3 scripts/generate_sbom.py \
            --version "${RELEASE_VERSION}" \
            --out "${sbom_file}"
          python3 scripts/generate_sbom.py --verify --out "${sbom_file}"

      - name: Aggregate and verify SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          find release-stage -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          (
            cd release-assets
            sha256sum *.tar.gz *.zip *.cdx.json | sort -k2 > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload aggregated release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ needs.resolve-version.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release (tags v*.*.* only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "Elysian Fields ${RELEASE_TAG}" \
              --generate-notes
          fi
