[workspace]
resolver = "3"
members = [
    "crates/elysian-smoke",
    "crates/elysian-bevy-probe",
    "crates/m1-accessibility",
    "crates/m1-streaming-perf",
    "crates/m1-text-i18n",
    "crates/m1-mobile-lifecycle",
    "crates/m1-web-delivery",
    "crates/ef-ui-catalog",
    "crates/ef-core",
    "crates/ef-clinic-domain",
    "crates/ef-harness",
    "crates/ef-boundaries",
    "crates/ef-clinic-server",
    "crates/ef-clinic-client",
    "crates/ef-connected-care",
    "crates/ef-clinic-workflows",
    "crates/ef-clinical-lib",
    "crates/ef-encoder",
    "crates/ef-patient-bank",
    "crates/ef-mobile-domain",
    "crates/ef-mobile-server",
    "crates/ef-mobile-client",
    "crates/ef-extension",
    "crates/ef-public-site",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned Bevy + AccessKit versions for M1 feasibility and clean-room UI foundation.
accesskit = "0.24.1"
bevy = { version = "0.20.1", default-features = false }
elysian-smoke = { path = "crates/elysian-smoke" }
# Shared serialization and typed-error crates for M2/M3 headless services and clients.
ef-core = { path = "crates/ef-core" }
ef-clinic-domain = { path = "crates/ef-clinic-domain" }
ef-clinic-workflows = { path = "crates/ef-clinic-workflows" }
ef-harness = { path = "crates/ef-harness" }
ef-ui-catalog = { path = "crates/ef-ui-catalog" }
ef-connected-care = { path = "crates/ef-connected-care" }
ef-clinical-lib = { path = "crates/ef-clinical-lib" }
ef-encoder = { path = "crates/ef-encoder" }
ef-patient-bank = { path = "crates/ef-patient-bank" }
ef-mobile-domain = { path = "crates/ef-mobile-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
disallowed_methods = "warn"
fn_params_excessive_bools = "warn"
map_err_ignore = "warn"
struct_excessive_bools = "warn"
unused_result_ok = "warn"

# Keep workspace incremental builds fast while optimizing Bevy and third-party
# crates lightly so dev/test execution remains responsive without paying full
# opt-level=3 cold-compile latency.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

# Strip release symbols and use ThinLTO so Wasm post-processing (`wasm-opt`)
# avoids parsing tens of megabytes of debug sections and stays well within the
# 240 s `rust-wasm` and `client_only_merge_secs` CI budgets on `main`.
[profile.release]
strip = "symbols"
lto = "thin"
