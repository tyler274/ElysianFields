[workspace]
resolver = "3"
members = [
    "crates/elysian-smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
disallowed_methods = "warn"
fn_params_excessive_bools = "warn"
map_err_ignore = "warn"
struct_excessive_bools = "warn"
unused_result_ok = "warn"
