# cargo-deny dependency guardrails for Elysian Realm CI.
# Run: cargo deny --all-features check advisories bans licenses sources

[graph]
# Inspect all targets so platform-specific and wasm-specific issues are caught.
all-features = true

[licenses]
version = 2
# Workspace crates are internal and unpublished; enforce license policy on dependencies.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies are declared without a registry version.
allow-wildcard-paths = true
deny = []

[advisories]
version = 2
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
