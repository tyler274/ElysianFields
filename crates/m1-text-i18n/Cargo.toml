[package]
name = "m1-text-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "M1 feasibility prototype for multiline text input, OS IME bridging, and international text shaping in Bevy."

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_input_focus",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
] }

[lints]
workspace = true
