[package]
name = "m1-accessibility"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "M1 Bevy 0.20.1 accessibility feasibility prototype covering AccessKit tree integrity, keyboard focus, WCAG AA contrast, 200% zoom, reduced motion, throttled live regions, and a narrow browser bridge."

[dependencies]
accesskit = { workspace = true }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_input_focus",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
] }

[lints]
workspace = true
