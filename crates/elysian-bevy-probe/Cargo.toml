[package]
name = "elysian-bevy-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Minimal headless Bevy UI, text, and accessibility probe validating multi-target CI budgets."

[dependencies]
accesskit = { workspace = true }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_input_focus",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
] }
elysian-smoke = { workspace = true }

[lints]
workspace = true
