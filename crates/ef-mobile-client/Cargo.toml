[package]
name = "ef-mobile-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Curie Mobile Bevy 0.20.1 client built on ef-ui-catalog and ef-mobile-domain with strict product isolation from Curie Clinic."

[dependencies]
accesskit = { workspace = true }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_input_focus",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
] }
ef-connected-care = { workspace = true }
ef-core = { workspace = true }
ef-mobile-domain = { workspace = true }
ef-ui-catalog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ef-mobile-server = { path = "../ef-mobile-server" }
